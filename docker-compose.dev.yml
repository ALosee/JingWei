services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: jingwei
      POSTGRES_USER: jingwei
      POSTGRES_PASSWORD: jingwei
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jingwei -d jingwei']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - jingwei-postgres:/var/lib/postgresql

volumes:
  jingwei-postgres:
